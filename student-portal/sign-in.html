<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartDormX</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sign-in.css">
</head>
<body>

<div class="bg-layer"></div>

<div class="card-wrap">
    <div class="card">

        <div class="brand">
            <div class="brand-badge">PAF-IAST</div>
            <h1>SmartDormX</h1>
            <p>Advancing Skills for Tomorrow through Innovation</p>
        </div>

        <div class="remembered-notice" id="rememberedNotice">
            <span>&#10003; Session restored — welcome back!</span>
        </div>

        <div class="field">
            <label>Email / Username</label>
            <div class="input-wrap">
                <input type="text" id="emailInput" placeholder="B22F0403CS046@fecid.edu.pk" autocomplete="username">
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <input type="password" id="passwordInput" placeholder="••••••••••" autocomplete="current-password">
                <button class="eye-btn" id="eyeBtn" type="button" aria-label="Toggle password">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="options">
            <label class="remember-label">
                <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <span class="forgot-link" onclick="openModal()">Forgot password?</span>
        </div>

        <button class="btn-signin" id="signInBtn" onclick="handleLogin()">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
    <div class="modal-box">

        <button class="modal-close" onclick="closeModal()" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <div class="modal-icon-wrap">
            <div class="modal-icon-ring">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
            </div>
        </div>

        <h3>Forgot your password?</h3>
        <div class="modal-rule"></div>
        <p>Your credentials are managed by your institution. Please contact the IT department for a reset.</p>

        <div class="modal-info-card">
            <div class="modal-info-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.6 19.79 19.79 0 01.22 1 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11l-1.27 1.27a16 16 0 006.29 6.29l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                </svg>
            </div>
            <div class="modal-info-text">
                <span>Contact</span>
                <strong>IT Help Desk — PAF-IAST</strong>
            </div>
        </div>

    </div>
</div>
<!-- 1. Supabase JS Library (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 2. Config & helpers File -->
<script src="supabase-config.js"></script>
<script src="supabase-helpers.js"></script>
<!-- 3. Existing scripts -->
<script src="header-slidebar.js"></script>
<script src="sign-in.js"></script>
</body>
</html>
